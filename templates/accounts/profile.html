{% extends 'base.html' %}
{% block title %}User Profile | EduPulse{% endblock %}

{% block content %}
<section class="section" style="padding: 10rem 0 6rem 0;">
  <div class="container" style="max-width: 600px;">
    <div class="modal-card" style="position: static; transform: none; max-width: 100%;">
      <h2 class="modal-title">My <span class="gradient-text">Profile</span></h2>
      <p class="modal-subtitle">Manage your personal details and avatar</p>

      <form action="{% url 'accounts:profile' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" value="{{ user.username }}" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" value="{{ user.email }}" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">Bio</label>
          {{ form.bio }}
        </div>
        <div class="form-group">
          <label class="form-label">Avatar URL</label>
          {{ form.avatar_url }}
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
