<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an EduPulse account</title>
</head>
<body>
  <main>
    <h1>Create your account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Create account</button>
    </form>
    <p><a href="{% url 'home' %}">Back to home</a></p>
  </main>
</body>
</html>
