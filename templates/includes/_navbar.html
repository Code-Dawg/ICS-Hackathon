{% load static %}
<header>
  <div class="container nav-container">
    <a href="{% url 'home:index' %}" class="logo">
      <div class="logo-icon">
        <i class="fa-solid fa-shoe-prints"></i>
      </div>
      <div class="logo-text">Edu<span>Pulse</span></div>
    </a>

    <ul class="nav-links">
      <li><a href="{% url 'home:index' %}" class="nav-link active">Home</a></li>
      <li><a href="{% url 'digitalfootprints:index' %}" class="nav-link">Digital Footprints</a></li>
      <li><a href="{% url 'journey:index' %}" class="nav-link">Learning Journey</a></li>
      <li><a href="{% url 'quiz:index' %}" class="nav-link">Quizzes</a></li>
      <li><a href="{% url 'leaderboard:index' %}" class="nav-link">Leaderboard</a></li>
      <li><a href="{% url 'statistics:index' %}" class="nav-link">Statistics</a></li>
      <li><a href="{% url 'blog:index' %}" class="nav-link">Blog</a></li>
      <li><a href="{% url 'contact:index' %}" class="nav-link">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>

      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:index' %}" class="btn btn-secondary">Dashboard</a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-primary">Logout</a>
      {% else %}
        <button class="btn btn-secondary open-login">Login</button>
        <button class="btn btn-primary open-register">Create Account</button>
      {% endif %}

      <button id="hamburger" class="hamburger" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
