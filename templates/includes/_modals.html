{% load static %}
<!-- Login Modal (Glassmorphism) -->
<div id="login-modal" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" aria-label="Close Modal"><i class="fa-solid fa-xmark"></i></button>
    <h2 class="modal-title">Welcome <span class="gradient-text">Back</span></h2>
    <p class="modal-subtitle">Log in to your EduPulse dashboard</p>

    <form action="{% url 'accounts:login' %}" method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username" class="form-input" placeholder="alexmercer" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember_me"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">Sign In</button>
    </form>

    <div class="social-login-divider">or continue with</div>

    <div class="social-btns">
      <button class="social-auth-btn"><i class="fa-brands fa-google"></i> Google</button>
      <button class="social-auth-btn"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="#" class="modal-switch" data-target="register">Create Account</a>
    </p>
  </div>
</div>

<!-- Create Account Modal (Glassmorphism) -->
<div id="register-modal" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" aria-label="Close Modal"><i class="fa-solid fa-xmark"></i></button>
    <h2 class="modal-title">Join <span class="gradient-text">EduPulse</span></h2>
    <p class="modal-subtitle">Start your digital footprint learning journey</p>

    <form action="{% url 'accounts:register' %}" method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="alexmercer" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password1" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="password2" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" required> I accept the Terms & Conditions
        </label>
      </div>

      <button type="submit" class="btn btn-glow" style="width: 100%; padding: 0.9rem;">Create Free Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="#" class="modal-switch" data-target="login">Log In</a>
    </p>
  </div>
</div>
