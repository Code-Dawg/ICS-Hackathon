{% extends 'base.html' %}
{% block title %}{{ article.title }} | EduPulse Blog{% endblock %}

{% block content %}
<section class="section" style="padding-top: 10rem;">
  <div class="container" style="max-width: 800px;">
    <div class="modal-card" style="position: static; transform: none; max-width: 100%;">
      <span style="color: var(--primary-cyan); font-weight: 700;">{{ article.category.name }} • {{ article.read_time }}</span>
      <h1 class="modal-title" style="font-size: 2.5rem; margin: 1rem 0;">{{ article.title }}</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Published on {{ article.published_at|date:"F d, Y" }}</p>

      <div style="line-height: 1.8; color: var(--text-main); font-size: 1.1rem;">
        {{ article.content|linebreaks }}
      </div>
    </div>
  </div>
</section>
{% endblock %}
